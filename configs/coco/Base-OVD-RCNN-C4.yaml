MODEL:
  META_ARCHITECTURE: "CustomRCNN"
  RPN:
    PRE_NMS_TOPK_TEST: 6000
    POST_NMS_TOPK_TEST: 1000
  ROI_HEADS:
    NAME: "CustomRes5ROIHeads"
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  RESNETS:
    DEPTH: 50
  ROI_BOX_HEAD:
    CLS_AGNOSTIC_BBOX_REG: True
    USE_SIGMOID_CE: True
    USE_ZEROSHOT_CLS: True
    # ZEROSHOT_WEIGHT_PATH: 'datasets/zeroshot_weights/coco_clip_a+photo+cname_o.npy'
    ZEROSHOT_WEIGHT_PATH: "/22liushoulong/projects4/ovfoodD_simple_VLM_nameprompt/datasets/zeroshot_weights/coco_clip_a+photo+cname.npy"
    IGNORE_ZERO_CATS: True
    CAT_FREQ_PATH: '/22liushoulong/datasets/ZSFooD2/zero-shot/instances_train2017_seen_2_oriorder_cat_info.json' # change to your path
DATASETS:
  TRAIN: ("coco_zeroshot_train_oriorder",)
  TEST: ("coco_generalized_zeroshot_val",)
SOLVER:
  IMS_PER_BATCH: 24 # Overall batch-size
  BASE_LR: 0.02
  STEPS: (60000, 80000)
  MAX_ITER: 90000
  CHECKPOINT_PERIOD: 10000
INPUT:
  MIN_SIZE_TRAIN: (800,)
VERSION: 2
OUTPUT_DIR: output/coco_ovd_base
FP16: False
SEED: 0